<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>13.02-13.52 · PS4 Exploit</title>
    <style>
      /* Styling Tampilan Modern & Gaming Theme (Selaras dengan cacheslopkit.html) */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #0f172a;
        color: #f8fafc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
      }

      .container {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 800px;
        padding: 30px 20px;
        margin: auto;
      }

      /* Logo & Header Styling */
      .logo-container {
        margin-bottom: 15px;
      }

      .logo {
        max-width: 100px;
        height: auto;
        display: block;
        margin: 0 auto;
      }

      .header-title {
        color: #e1e8ea;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: none;
        margin-bottom: 25px;
        border-bottom: 2px solid #334155;
        padding-bottom: 15px;
      }

      /* Status Card (menggantikan layout fixed/absolute lama) */
      .status-card {
        background: #0f172a;
        border-radius: 12px;
        border: 1px solid #38bdf8;
        padding: 40px 20px;
        margin: 20px 0;
        box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.1);
        min-height: 150px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      /* running: a spinner inside the status card. jb.js sets body.done / body.fail / body.log. */
      #spin {
        width: 46px;
        height: 46px;
        border: 4px solid #334155;
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #msg {
        font-size: 20px;
        font-weight: 600;
        color: #e50707; /* Warna merah error selaras dengan slopkit */
        letter-spacing: 0.5px;
        display: none;
      }

      #wrap {
        width: 100%;
        text-align: left;
        display: none;
      }
      #state,
      #out {
        display: none;
      }

      /* State Control via body classes */
      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, diselaraskan dengan warna tema baru */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log .status-card {
        padding: 20px;
        display: block; /* Disable flex centering for logs */
      }
      body.log #wrap {
        display: block;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 12px;
        color: #e1e8ea;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 13px/1.5 Consolas, monospace;
        background: #0b0d10;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 15px;
        height: 400px;
        max-height: 50vh;
        overflow-y: auto;
      }

      /* Log color mapping disesuaikan dengan skema slopkit */
      .ok { color: #22c55e; }
      .bad { color: #e50707; }
      .warn { color: #eab308; }
      .safe { color: #22c55e; }
      .danger { color: #e50707; }
      code { color: #38bdf8; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-container">
        <img src="logo.png" alt="Logo" class="logo">
      </div>
      <div class="header-title">13.02-13.52 · PS4 Exploit</div>

      <div class="status-card">
        <div id="spin"></div>
        <div id="msg">Tahan tombol PS > Power > Restart PS4</div>
        <div id="wrap">
          <div id="state"></div>
          <div id="out"></div>
        </div>
      </div>
    </div>
    <script type="module">
      import "./jb.js?v=19";
    </script>
  </body>
</html>
