<html manifest="cache.appcache">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>13.02-13.52 · PS4 Exploit</title>
<style>
    /* Styling Tampilan Modern & Gaming Theme (Selaras dengan cacheslopkit.html) */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #0f172a;
        color: #f8fafc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
    }

    .container {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 800px;
        padding: 30px 20px;
        margin: auto;
    }

    /* Logo Styling */
    .logo-container {
        margin-bottom: 15px;
    }

    .logo {
        max-width: 100px;
        height: auto;
        display: block;
        margin: 0 auto;
    }

    .header-title {
        color: #e1e8ea;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: none;
        margin-bottom: 25px;
        border-bottom: 2px solid #334155;
        padding-bottom: 15px;
    }

    .status-card {
        background: #0f172a;
        border-radius: 12px;
        border: 1px solid #38bdf8;
        padding: 30px 20px;
        margin: 20px 0;
        box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.1);
    }

    /* Teks notifikasi */
    #msgs {
        font-size: 22px;
        color: #ffffff; 
        font-weight: 600;
        line-height: 1.5;
        margin-bottom: 15px;
        transition: color 0.3s ease;
    }

    #msgs.success {
        color: #22c55e !important;
    }

    /* Styling Progress Bar */
    .progress-container {
        width: 100%;
        background-color: #334155;
        border-radius: 10px;
        overflow: hidden;
        height: 16px;
        margin-top: 15px;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        border-radius: 10px;
        transition: width 0.3s ease;
    }
</style>
<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

// Helper function untuk memberikan warna teks berdasarkan status
function setMsg(htmlContent, type) {
    var msgsElem = document.getElementById("msgs");
    if(!msgsElem) return;
    
    msgsElem.className = ""; 
    if (type === "success") {
        msgsElem.classList.add("success");
    }
    msgsElem.innerHTML = htmlContent;
}

function DLProgress(e) {
    var pct = Math.round(e.loaded / e.total * 100);
    setMsg("Installing... " + pct + "%", "running");
    
    // Update progress bar
    var bar = document.getElementById("pbar");
    if (bar) {
        bar.style.width = pct + "%";
    }
}

function DisplayCacheProgress() {
    setTimeout(function () {
        setMsg("Cache OK", "success");
        var bar = document.getElementById("pbar");
        if (bar) {
            bar.style.width = "100%";
        }
    }, 2000);
    setTimeout(function () {
        location.reload();
    }, 3000);
}

window.applicationCache.addEventListener("progress", DLProgress, false);
window.applicationCache.oncached = function (e) { DisplayCacheProgress(); };
window.applicationCache.onupdateready = function (e) { DisplayCacheProgress(); };
</script>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="logo.png" alt="Logo" class="logo">
    </div>

    <div class="header-title">13.02-13.52 · PS4 Exploit</div>
    
    <div class="status-card">
        <div id="msgs">Memulai...</div>
        <div class="progress-container">
            <div id="pbar" class="progress-bar"></div>
        </div>
    </div>
</div>

</body>
</html>
