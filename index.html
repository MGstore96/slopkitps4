<html manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>13.02-13.52 · PS4 Exploit</title>
    <style>
        /* Styling Tampilan Modern & Gaming Theme (Selaras dengan cacheslopkit.html) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 800px;
            padding: 30px 20px;
            margin: auto;
        }

        /* Logo Styling */
        .logo-container {
            margin-bottom: 15px;
        }

        .logo {
            max-width: 100px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .header-title {
            color: #e1e8ea;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: none;
            margin-bottom: 25px;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }

        /* Styling Konsol Log */
        .status-card {
            background: #0b0d10;
            border-radius: 12px;
            border: 1px solid #38bdf8;
            padding: 20px;
            margin: 20px 0;
            box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.1);
            text-align: left;
            min-height: 200px;
        }

        #console {
            font-family: Consolas, monospace;
            font-size: 14px;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        /* Penyesuaian warna log dengan skema warna baru */
        .ok   { color: #22c55e; } /* Hijau terang */
        .bad  { color: #e50707; } /* Merah terang */
        .warn { color: #eab308; } /* Kuning peringatan */
    </style>
    <script>
    if (window.applicationCache && window.applicationCache.status == 0) {
        window.location.replace("cache.html");
    }
    </script>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo">
        </div>

        <div class="header-title">13.02-13.52 · PS4 Exploit</div>
        
        <div class="status-card">
            <pre id="console"></pre>
        </div>
    </div>
</body>
<script>
(function () {
    var con = document.getElementById("console");

    function print(msg, cls) {
        var span = document.createElement("span");
        if (cls) span.className = cls;
        span.textContent = msg + "\n";
        con.appendChild(span);
    }

    var params = new URLSearchParams(location.search);

    // Firmwares with measured kernel table — KEEP IN SYNC with ps4_offsets.js
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced    = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

    print("firmware: " + (key || "unknown"));
    print("supported: " + (supported ? "yes" : "no"), supported ? "ok" : "bad");

    var target = "jb.html" + location.search;

    function go() {
        print("loading exploit...", "warn");
        location.replace(target);
    }

    function waitForTap(msg, action) {
        print(msg, "warn");
        function fire() {
            window.removeEventListener("click",   fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click",   fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        print("Perangkat ini bukan PS4 Bro", "bad");
        waitForTap("", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        print("offline — running from cache", "ok");
        go();
    } else if (ac.status === ac.IDLE) {
        print("cached", "ok");
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        print("update downloaded", "ok");
        waitForTap("UPDATE READY — Press X/O to reload", function () { location.reload(); });
    } else {
        print("checking cache...");
        ac.addEventListener("downloading",
            function () { print("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                print("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            print("cached for offline use", "ok");
            waitForTap("CACHED — Press X/O to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            print("update downloaded", "ok");
            waitForTap("UPDATE READY — Press X/O to reload",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            print("cached — offline ready", "ok");
            go();
        }, false);
        ac.addEventListener("error", function () {
            print("cache unavailable");
            waitForTap("CACHE FAILED — Press X/O to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            print("cache obsolete");
            waitForTap("CACHE OBSOLETE — Press X/O to run", go);
        }, false);
    }
})();
</script>
</html>
